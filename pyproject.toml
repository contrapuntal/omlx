[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx"
dynamic = ["version"]
description = "LLM inference server, optimized for your Mac"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "omlx contributors"}
]
keywords = ["llm", "mlx", "apple-silicon", "vllm", "inference", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mlx>=0.31.2",
    # mlx-lm from commit (ed1fca4, v0.31.3) - thread-local generation stream + ArraysCache batch dim fixes + think token None safety
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@ed1fca4cef15a824c5f1702c80f70b4cffc8e4dd",
    # regex for mlx-lm's Gemma 4 tool parser (uses recursive patterns)
    "regex",
    # mlx-embeddings from latest commit (32981fa)
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings@32981fa4e8064ed664b52071789dd18271fe4206",
    # transformers version aligned with mlx-lm requirement
    # 5.4.0 previously broke VLM (Qwen2VLImageProcessor hard-required torch, mlx-vlm #431);
    # resolved upstream by mlx-vlm #1048 (torch-free numpy processors for Qwen2/2.5/3/3.5-VL),
    # so ceiling raised to <5.6.0 to satisfy new mlx-vlm (>=5.5.0).
    "transformers>=5.0.0,<5.6.0",
    "tokenizers>=0.19.0",
    "huggingface-hub>=0.23.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "itsdangerous>=2.0",
    "jinja2>=3.0",
    "sentencepiece",
    "tiktoken",
    "protobuf",
    "requests>=2.28.0",
    # SOCKS proxy support (used by httpx via huggingface-hub)
    "socksio>=1.0.0",
    "tabulate>=0.9.0",
    # Resource monitoring
    "psutil>=5.9.0",
    # Server
    "fastapi>=0.108.0",
    "uvicorn>=0.23.0",
    # JSON Schema validation for structured output
    "jsonschema>=4.0.0",
    # Harmony format parser for gpt-oss models
    "openai-harmony",
    # mlx-vlm from commit (0f903f9, 2026-04-24) - server decode, thread-local stream, DFlash, and Gemma 4 fixes
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm@0f903f90aaae69e220e4a4bbbc065011548a2dfe",
    "Pillow>=9.0.0",
    # dflash-mlx v0.1.3 (814c4a1) — block diffusion speculative decoding + temperature sampling
    "dflash-mlx @ git+https://github.com/jundot/dflash-mlx@814c4a1",
]

[project.optional-dependencies]
grammar = [
    # Grammar-constrained decoding for structured output (requires torch ~2GB)
    "xgrammar>=0.1.32",
]
mcp = [
    "mcp>=1.0.0",
]
modelscope = [
    "modelscope>=1.10.0",
]
audio = [
    # mlx-audio pinned to contrapuntal/mlx-audio fork-main, which is
    # Blaizzy/mlx-audio main (HEAD a5867d7, 2026-04-23) plus two carry patches:
    #   - voxtral-eos-token-ids-bypass: fixes Voxtral STT crash on tokenizer
    #     `eos_token_ids` initialization (re-frames closed upstream PR #450)
    #   - canary-mlx-converted-checkpoint-support: fixes silent half-decoder
    #     load on MLX-converted canary checkpoints (alt key naming + already-
    #     MLX conv layout heuristic)
    # tts extra: misaki, num2words, spacy, phonemizer-fork, espeakng-loader, sentencepiece
    # stt extra: sentencepiece — upstream PR #673 stripped tiktoken and
    #   mistral-common from [stt]; both are pinned directly below so the
    #   implicit transitive contract no longer matters.
    # sts extra: tts deps + stt deps + webrtcvad
    "mlx-audio[tts,stt,sts] @ git+https://github.com/contrapuntal/mlx-audio@362228d8480d319cbaeb9c30aebb97fc628b9365",
    "python-multipart>=0.0.5",
    # mistral-common[audio] is required by Voxtral STT (transformers' processing_voxtral.py
    # imports `TranscriptionRequest` from it). mlx-audio PR #673 (Apr 23, 2026) silently
    # removed this from the `[stt]` extra; pin it here so we don't depend on the upstream
    # `[tts]` extra continuing to declare it. Floor is 1.11.0 because transformers
    # 5.5.x imports `ReasoningEffort` from mistral_common which only exists from 1.11.
    "mistral-common[audio]>=1.11.0",
    # torch is required by Voxtral STT specifically: transformers' WhisperFeatureExtractor
    # hardcodes `return_tensors='pt'` in its Voxtral processor. Other ASR/STT models in
    # mlx-audio do not need torch. ~2GB.
    "torch>=2.0.0",
    # librosa is required by transformers' audio_utils.load_audio_as which Voxtral's
    # processor calls. mlx-audio PR #662 (Apr 21, 2026) removed librosa from its own
    # transitive deps; pin it here so Voxtral STT doesn't break when mlx-audio drops it.
    "librosa>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.0.0",
]
# PEP 735 dependency groups — consumed by `uv sync --dev`.
# Keep in sync with [project.optional-dependencies] dev above
# (pip/legacy toolchains use that section instead).
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/jundot/omlx"
Documentation = "https://github.com/jundot/omlx#readme"
Repository = "https://github.com/jundot/omlx"

[project.scripts]
omlx = "omlx.cli:main"

[tool.setuptools.dynamic]
version = {attr = "omlx._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["omlx*"]

[tool.setuptools.package-data]
"omlx" = ["oq_calibration_data.json"]
"omlx.admin" = ["templates/**/*.html", "static/**/*", "i18n/*.json"]
"omlx.eval" = ["data/*.jsonl"]

[tool.uv]
# mlx-lm is pinned to a git commit; override transitive pins
# (e.g. mlx-audio → mlx-lm==0.31.1) so the resolver accepts it.
override-dependencies = [
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm@ed1fca4cef15a824c5f1702c80f70b4cffc8e4dd",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
